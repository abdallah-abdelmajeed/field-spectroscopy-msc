      (function() {
        // Suppress uncaught 'fetch of #<Window> which has only a getter' errors
        try {
          window.addEventListener('error', function(e) {
            if (e && e.message && e.message.indexOf('fetch') !== -1 && e.message.indexOf('getter') !== -1) {
              e.preventDefault();
              e.stopImmediatePropagation();
              return true;
            }
          }, true);

          var origOnError = window.onerror;
          window.onerror = function(msg, url, line, col, error) {
            if (typeof msg === 'string' && msg.indexOf('fetch') !== -1 && msg.indexOf('getter') !== -1) {
              return true;
            }
            if (origOnError) {
              return origOnError.apply(this, arguments);
            }
          };
        } catch (err) {}

        // Make window.fetch writable and configurable across prototype chain
        try {
          var currentFetch = window.fetch || (typeof globalThis !== 'undefined' ? globalThis.fetch : null);
          if (currentFetch) {
            var proto = window;
            while (proto) {
              try {
                var desc = Object.getOwnPropertyDescriptor(proto, 'fetch');
                if (desc) {
                  Object.defineProperty(proto, 'fetch', {
                    get: function() { return currentFetch; },
                    set: function(val) { currentFetch = val; },
                    configurable: true,
                    enumerable: true
                  });
                }
              } catch (eDesc) {}
              proto = Object.getPrototypeOf(proto);
            }

            try {
              Object.defineProperty(window, 'fetch', {
                get: function() { return currentFetch; },
                set: function(val) { currentFetch = val; },
                configurable: true,
                enumerable: true
              });
            } catch (eWin) {}

            try {
              if (typeof Window !== 'undefined' && Window.prototype) {
                Object.defineProperty(Window.prototype, 'fetch', {
                  get: function() { return currentFetch; },
                  set: function(val) { currentFetch = val; },
                  configurable: true,
                  enumerable: true
                });
              }
            } catch (eProto) {}

            try {
              if (typeof globalThis !== 'undefined' && globalThis !== window) {
                Object.defineProperty(globalThis, 'fetch', {
                  get: function() { return currentFetch; },
                  set: function(val) { currentFetch = val; },
                  configurable: true,
                  enumerable: true
                });
              }
            } catch (eGlobal) {}
          }
        } catch (e) {}
      })();
